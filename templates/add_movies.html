{% extends 'base.html' %}

{% block title %}Add Movie{% endblock %}

{% block content %}

<div class="row justify-content-center">

<div class="col-md-6">

<div class="card p-4">

<h2 class="text-danger mb-4">
    {% if movie %}
        Edit Movie
    {% else %}
        Add Movie
    {% endif %}
</h2>

<form method="POST">

    <div class="mb-3">
        <label>Movie Title</label>
        <input type="text"
               name="title"
               class="form-control"
               value="{{ movie.MovieTitle if movie else '' }}"
               required>
    </div>

    <div class="mb-3">
        <label>Genre</label>
        <input type="text"
               name="genre"
               class="form-control"
               value="{{ movie.Genre if movie else '' }}"
               required>
    </div>

    <div class="mb-3">
        <label>Duration</label>
        <input type="number"
               name="duration"
               class="form-control"
               value="{{ movie.DurationMinutes if movie else '' }}"
               required>
    </div>

    <button class="btn btn-red w-100">
        Save Movie
    </button>

</form>

</div>

</div>

</div>

{% endblock %}

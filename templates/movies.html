{% extends 'base.html' %}
{% block title %}Quản lý phim{% endblock %}
{% block content %}
<h2 class="text-danger mb-4">QUẢN LÝ PHIM</h2>
<a href="{{ url_for('add_movie') }}" class="btn btn-danger mb-3">Thêm phim</a>
<table class="table table-dark table-striped">
  <thead class="bg-danger text-white">
    <tr>
      <th>ID</th><th>Tiêu đề</th><th>Thể loại</th><th>Thời lượng</th><th>Hành động</th>
    </tr>
  </thead>
  <tbody>
    {% for m in movies %}
    <tr>
      <td>{{ m.MovieID }}</td>
      <td>{{ m.MovieTitle }}</td>
      <td>{{ m.Genre }}</td>
      <td>{{ m.DurationMinutes }} phút</td>
      <td>
        <a href="{{ url_for('edit_movie', movie_id=m.MovieID) }}" class="btn btn-warning btn-sm">Sửa</a>
        <form method="POST" action="{{ url_for('delete_movie', movie_id=m.MovieID) }}" style="display:inline;">
          <button class="btn btn-danger btn-sm">Xóa</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
